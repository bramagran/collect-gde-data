services:
  collect-gde-data:
    ports: !reset []
    networks: [proxy]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3335/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true